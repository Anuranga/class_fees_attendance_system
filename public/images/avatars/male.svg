<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-male" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="shirt-grad-male" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="hair-grad-male" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Background -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-grad-male)" />
  <circle cx="60" cy="60" r="54" fill="#EEF2FF" />

  <!-- Body / Shoulders -->
  <path d="M 28 114 C 28 92, 42 84, 60 84 C 78 84, 92 92, 92 114 Z" fill="url(#shirt-grad-male)" />
  <!-- Shirt Collar -->
  <path d="M 52 84 L 60 94 L 68 84 Z" fill="#FFFFFF" />
  <path d="M 56 84 L 60 91 L 64 84 Z" fill="#6366F1" />

  <!-- Neck -->
  <rect x="53" y="68" width="14" height="18" rx="7" fill="#FCD34D" />

  <!-- Head / Face -->
  <ellipse cx="60" cy="56" rx="20" ry="23" fill="#FDE68A" filter="url(#soft-shadow)" />

  <!-- Ears -->
  <circle cx="39" cy="57" r="5" fill="#FCD34D" />
  <circle cx="81" cy="57" r="5" fill="#FCD34D" />

  <!-- Boy Hair -->
  <path d="M 38 52 C 38 35, 48 30, 60 30 C 72 30, 82 35, 82 52 C 82 52, 78 44, 68 44 C 58 44, 52 48, 38 52 Z" fill="url(#hair-grad-male)" />
  <path d="M 40 45 C 48 38, 58 39, 64 43" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="52" cy="56" rx="2.5" ry="3.5" fill="#1E293B" />
  <ellipse cx="68" cy="56" rx="2.5" ry="3.5" fill="#1E293B" />
  <circle cx="53" cy="55" r="1" fill="#FFFFFF" />
  <circle cx="69" cy="55" r="1" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M 48 50 Q 52 48 56 50" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 64 50 Q 68 48 72 50" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 60 56 L 60 60 L 62 60" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Smile -->
  <path d="M 54 65 Q 60 70 66 65" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Cheerful Cheeks -->
  <ellipse cx="47" cy="62" rx="3" ry="1.8" fill="#FCA5A5" opacity="0.6" />
  <ellipse cx="73" cy="62" rx="3" ry="1.8" fill="#FCA5A5" opacity="0.6" />
</svg>
